<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>由鋁罐製作明礬｜動畫簡報</title><script src="assets/hyperframes-player.global.js"></script><script src="assets/hyperframes-slideshow.global.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c35}hyperframes-slideshow{display:block;position:relative;width:100vw;height:100vh}hyperframes-player{position:absolute;inset:0}</style></head><body><hyperframes-slideshow tabindex="0" notes-storage-key="alum-chemistry-20261019"><hyperframes-player interactive src="composition/index.html"></hyperframes-player><script type="application/hyperframes-slideshow+json">{"slides": [{"sceneId": "s1", "startTime": 0, "endTime": 10, "fragments": [0.1, 0.4, 0.7], "notes": "今天追蹤的是鋁的去向。鋁罐不是直接變成晶體，而是先發生化學反應，最後透過結晶取得新物質。封面的晶體是形狀示意，不是實驗照片。"}, {"sceneId": "s2", "startTime": 10, "endTime": 20, "fragments": [10.1, 10.4, 10.7], "notes": "先給聽眾一張路線圖。前半段是化學轉換；後半段利用溶解度差異分離產物。過濾的時機不同，留下的東西也不同。"}, {"sceneId": "s3", "startTime": 20, "endTime": 30, "fragments": [20.1, 20.4, 20.7], "notes": "鋁罐不只有鋁，也有塗層與合金成分。依老師提供的方法去除表面塗層。質量記錄是後面計算產率的基礎；不要把整個罐子的重量當成純鋁質量。"}, {"sceneId": "s4", "startTime": 30, "endTime": 40, "fragments": [30.1, 30.4, 30.7], "notes": "這是氧化還原反應：鋁由零價轉為三價，水中的氫被還原為氫氣。鋁以四羥基合鋁酸根存在。氣泡並非沸騰的證據。氫氣易燃，須在通風櫥依指導操作，遠離火源；不可密閉。"}, {"sceneId": "s5", "startTime": 40, "endTime": 50, "fragments": [40.1, 40.4, 40.7], "notes": "這一步不是把明礬濾出來。明礬尚未形成，目標鋁仍在溶液中。第一次過濾留下濾液，最後結晶後才收集固體。濾液仍有腐蝕性。"}, {"sceneId": "s6", "startTime": 50, "endTime": 60, "fragments": [50.1, 50.4, 50.7], "notes": "先中和多餘的鹼，條件改變時可出現白色氫氧化鋁，再於足夠酸性下溶解。白色沉澱不是明礬晶體。酸鹼混合會放熱，依講義慢慢加入並攪拌，勿自行套用其他教材的濃度用量。"}, {"sceneId": "s7", "startTime": 60, "endTime": 70, "fragments": [60.1, 60.4, 60.7], "notes": "當溶液條件合適，冷卻可使溶液過飽和而析出晶體。不要說所有冷卻的溶液都一定結晶。十二個水分子是化學式中的結晶水；圖中離子數量、距離與晶體外形是示意，沒有呈現真實晶格或完整水合結構。"}, {"sceneId": "s8", "startTime": 70, "endTime": 80, "fragments": [70.1, 70.4, 70.7], "notes": "最後的過濾與前面不同，這時留下固體。洗液溫度與用量會影響產物溶失。乾燥是去除表面洗液，不能任意高溫烘烤，以免改變水合狀態。廢液依實驗室規範分類回收，不採用其他教材的排放建議。"}, {"sceneId": "s9", "startTime": 80, "endTime": 90, "fragments": [80.1, 80.4, 80.7], "notes": "這不是質量憑空增加，鉀、硫酸根和結晶水都進入產物。17.58是摩爾質量之比，前提是鋁為限制試劑、樣品為純鋁且產物為十二水合明礬。真實鋁罐含合金與殘留物，需依講義修正。超過100%不代表更成功，可能是濕晶體或雜質。"}, {"sceneId": "s10", "startTime": 90, "endTime": 100, "fragments": [90.1, 90.4, 90.7], "notes": "總結：鋁先在鹼中溶解，加酸提供合適離子條件，最後結晶並分離。這是概念動畫，不是獨立操作手冊。實際濃度、用量、加熱及廢液處置以授課講義為準。請問聽眾：兩次過濾各自保留哪一側？白色氫氧化鋁與明礬晶體有何不同？參考教材：Truman State University Preparation and Analysis of Alum；University of Missouri–St. Louis Making Scrap Aluminum into a Useful Chemical。"}], "slideSequences": []}</script></hyperframes-slideshow><script>document.querySelector('hyperframes-slideshow').focus();</script></body></html>
